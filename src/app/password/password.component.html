<!-- password.component.html -->
<div class="password-container">
    <form (ngSubmit)="onSubmit()">
        <input type="email" name="email" [(ngModel)]="email" placeholder="ელფოსტა" autocomplete="username" />
        <input type="password" name="password" [(ngModel)]="password" placeholder="პაროლი" autocomplete="current-password" />
        <button type="submit" [disabled]="submitting">{{ submitting ? 'შესვლა…' : 'შესვლა' }}</button>
    </form>
    <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>
</div>
