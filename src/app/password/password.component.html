<div class="login">
  <div class="card">
    <h2 class="page-title">შესვლა</h2>

    <div class="notice error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">ელფოსტა</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">პაროლი</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" autocomplete="current-password" />
      </div>

      <button type="submit" class="submit" [disabled]="submitting">
        {{ submitting ? 'შესვლა…' : 'შესვლა' }}
      </button>
    </form>
  </div>
</div>
