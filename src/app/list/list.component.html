<div class="prices">
  <h2 class="page-title">ფასები</h2>

  <input
    type="text"
    (input)="onInputChange($event)"
    placeholder="შეიყვანეთ შტატი"
    class="search-input"
    [disabled]="loading"
  />

  <p *ngIf="loading" class="loading">იტვირთება…</p>
  <div *ngIf="error" class="notice error">{{ error }}</div>

  <ul class="state-list" *ngIf="!loading && !error">
    <li *ngIf="filteredStates.length === 0" class="empty">შედეგი ვერ მოიძებნა</li>
    <li *ngFor="let state of filteredStates">{{ state }}</li>
  </ul>
</div>
