
<div class="search-container">
    <!-- Input field to type search query -->
    <input type="text" (input)="onInputChange($event)" placeholder="შეიყვანეთ შტატი" class="search-input" [disabled]="loading">

    <p *ngIf="loading" class="list-status">იტვირთება…</p>
    <p *ngIf="error" class="list-status error">{{ error }}</p>

    <!-- Listbox to display filtered results -->
    <ul class="state-list" *ngIf="!loading && !error">
        <li *ngIf="filteredStates.length === 0">No results found</li>
        <li *ngFor="let state of filteredStates">{{ state }}</li>
      </ul>

</div>
