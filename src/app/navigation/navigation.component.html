<a class="brand" [routerLink]="auth.homePath() || '/password'">
  <img src="/assets/imgs/logo.png" alt="Solo Auto Import" />
</a>

<ng-container *ngIf="auth.user$ | async as user">
  <!-- Desktop links: every page from pages.ts this account was granted. -->
  <div class="menu-container">
    <ng-container *ngFor="let page of pages">
      <a [routerLink]="'/' + page.key" routerLinkActive="active" *ngIf="auth.canAccess(page.key)">{{ page.label }}</a>
    </ng-container>
    <a routerLink="/admin" routerLinkActive="active" *ngIf="auth.isAdmin">ადმინი</a>
    <button type="button" class="logout" (click)="logout()">გასვლა</button>
  </div>

  <!-- Mobile toggle -->
  <button
    type="button"
    class="burger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="მენიუ"
  >
    <span class="burger-line"></span>
    <span class="burger-line"></span>
    <span class="burger-line"></span>
  </button>

  <!-- Mobile drawer -->
  <div class="mobile-menu" [class.active]="menuOpen">
    <ng-container *ngFor="let page of pages">
      <a [routerLink]="'/' + page.key" (click)="closeMenu()" *ngIf="auth.canAccess(page.key)">{{ page.label }}</a>
    </ng-container>
    <a routerLink="/admin" (click)="closeMenu()" *ngIf="auth.isAdmin">ადმინი</a>
    <button type="button" class="logout" (click)="logout()">გასვლა</button>
  </div>
</ng-container>
