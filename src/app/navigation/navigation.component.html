<a class="brand" routerLink="/calculator">
  <img src="/assets/imgs/logo.png" alt="Solo Auto Import" />
</a>

<ng-container *ngIf="auth.user$ | async as user">
  <!-- Desktop links. Only the calculator is offered to the `user` role. -->
  <div class="menu-container">
    <a routerLink="/deposit" routerLinkActive="active" *ngIf="user.role === 'admin'">დეპოზიტი</a>
    <a routerLink="/vehicle" routerLinkActive="active" *ngIf="user.role === 'admin'">საფასური</a>
    <a routerLink="/calculator" routerLinkActive="active">კალკულატორი</a>
    <a routerLink="/admin" routerLinkActive="active" *ngIf="user.role === 'admin'">ადმინი</a>
    <button type="button" class="logout" (click)="logout()">გასვლა</button>
  </div>

  <!-- Mobile toggle -->
  <button
    type="button"
    class="burger"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="მენიუ"
  >
    <span class="burger-line"></span>
    <span class="burger-line"></span>
    <span class="burger-line"></span>
  </button>

  <!-- Mobile drawer -->
  <div class="mobile-menu" [class.active]="menuOpen">
    <a routerLink="/deposit" (click)="closeMenu()" *ngIf="user.role === 'admin'">დეპოზიტი</a>
    <a routerLink="/vehicle" (click)="closeMenu()" *ngIf="user.role === 'admin'">საფასური</a>
    <a routerLink="/calculator" (click)="closeMenu()">კალკულატორი</a>
    <a routerLink="/admin" (click)="closeMenu()" *ngIf="user.role === 'admin'">ადმინი</a>
    <button type="button" class="logout" (click)="logout()">გასვლა</button>
  </div>
</ng-container>
